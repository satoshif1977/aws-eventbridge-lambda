name: Terraform CI & Python Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  terraform:
    name: Fmt / Validate
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Format
        run: terraform fmt --check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  test:
    name: Python ユニットテスト
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_DEFAULT_REGION: ap-northeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest boto3 botocore pytest-cov

      - name: pytest scheduler
        run: pytest lambda_src/scheduler/test_index.py -v --cov=lambda_src/scheduler --cov-report=xml:coverage-scheduler.xml

      - name: pytest processor
        run: pytest lambda_src/processor/test_index.py -v --cov=lambda_src/processor --cov-report=xml:coverage-processor.xml --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-scheduler.xml,./coverage-processor.xml
          flags: lambda
          fail_ci_if_error: false

  security:
    name: Checkov セキュリティスキャン
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          skip_check: >-
            CKV_AWS_117,CKV_AWS_272,
            CKV_AWS_116,CKV_AWS_115,
            CKV_AWS_28,CKV_AWS_338,
            CKV_AWS_18,CKV_AWS_144,
            CKV2_AWS_62
          output_format: cli

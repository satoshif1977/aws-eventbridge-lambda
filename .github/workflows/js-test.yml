name: JavaScript Test

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
  pull_request:
    paths:
      - "scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run tests
        working-directory: scripts
        run: npm test

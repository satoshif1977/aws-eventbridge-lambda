name: TypeScript Test

on:
  push:
    branches: [master]
    paths:
      - 'lambda_ts/**'
      - '.github/workflows/ts-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'lambda_ts/**'
      - '.github/workflows/ts-test.yml'

jobs:
  ts-test:
    name: TypeScript ユニットテスト（Jest）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lambda_ts

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lambda_ts/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      - name: TypeScript 型チェック
        run: npx tsc --noEmit

      - name: Jest ユニットテスト実行
        run: npm test -- --coverage --coverageReporters=text-summary
